openapi: 3.0.0
info:
  title: SV Streaming API
  version: 0.0.1
tags:
  - name: sv
servers:
  - url: https://example.com/api/sv
paths:

  /v0/onboard/sv/download/{id}:
    get:
      tags: [sv]
      x-jvm-package: sv_public_stream
      x-external-audience: svs
      operationId: "onboardSvDownload"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The exported snapshot.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                x-scala-type: org.apache.pekko.http.scaladsl.model.ResponseEntity
        "404":
          $ref: "../../../../common/src/main/openapi/common-external.yaml#/components/responses/404"
        "500":
          $ref: "../../../../common/src/main/openapi/common-external.yaml#/components/responses/500"
        "503":
          $ref: "../../../../common/src/main/openapi/common-external.yaml#/components/responses/503"
