# One sync operator per node of the four-node synchronizer in standalone-sync-operator-bft.conf,
# on top of sync-operator-topology.conf. All four read as the same operator party, so each keeps
# its store in its own database, see SyncOperatorBftIntegrationTest.usesDbs.
canton.sync-operator-apps {
  syncOperator.synchronizer-nodes.current.sequencer.admin-api.port = 29109

  syncOperator2 = ${canton.sync-operator-apps.syncOperator} {
    storage.config.properties.databaseName = "splice_apps_sync_operator_bft_2"
    admin-api.port = 5126
    synchronizer-nodes.current.sequencer.admin-api.port = 29209
  }

  syncOperator3 = ${canton.sync-operator-apps.syncOperator} {
    storage.config.properties.databaseName = "splice_apps_sync_operator_bft_3"
    admin-api.port = 5136
    synchronizer-nodes.current.sequencer.admin-api.port = 29309
  }

  syncOperator4 = ${canton.sync-operator-apps.syncOperator} {
    storage.config.properties.databaseName = "splice_apps_sync_operator_bft_4"
    admin-api.port = 5146
    synchronizer-nodes.current.sequencer.admin-api.port = 29409
  }
}
