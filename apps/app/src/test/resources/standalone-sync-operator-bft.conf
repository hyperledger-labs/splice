# The four nodes of a dedicated synchronizer on the BFT driver, for SyncOperatorBftIntegrationTest.
# Node n uses ports 29n07 to 29n10 and lists the other nodes as its peers.
# standalone-sync-operator-bft-bootstrap.sc bootstraps the synchronizer, and the test creates the
# databases, see SyncOperatorBftIntegrationTest.usesDbs.
include required("include/canton-basic.conf")
include required("include/sequencers.conf")
include required("include/mediators.conf")

# No app initializes these nodes, so they initialize their own identity.
_sync_operator_bft_auto_init {
  init.generate-topology-transactions-and-keys = true
  init.identity.type = auto
}

_sync_operator_bft_peer {
  address = "localhost"
  tls-config.enabled = false
}

canton {
  parameters {
    non-standard-config = yes
  }

  sequencers {
    syncOperatorBftSequencer1 = ${_sequencer_reference_template} ${_sync_operator_bft_auto_init} {
      public-api.port = 29108
      admin-api.port = 29109
      storage.config.properties.databaseName = "sequencer_sync_operator_bft_1"
    }
    syncOperatorBftSequencer1.sequencer = ${_sequencer_bft_template}
    syncOperatorBftSequencer1.sequencer.config {
      storage.config.properties.databaseName = "sequencer_driver_sync_operator_bft_1"
      consensus-empty-block-creation-timeout = 250ms
      initial-network.server-endpoint.port = 29110
      initial-network.server-endpoint.external-port = 29110
      initial-network.peer-endpoints = [
        ${_sync_operator_bft_peer} { port = 29210 }
        ${_sync_operator_bft_peer} { port = 29310 }
        ${_sync_operator_bft_peer} { port = 29410 }
      ]
    }

    syncOperatorBftSequencer2 = ${_sequencer_reference_template} ${_sync_operator_bft_auto_init} {
      public-api.port = 29208
      admin-api.port = 29209
      storage.config.properties.databaseName = "sequencer_sync_operator_bft_2"
    }
    syncOperatorBftSequencer2.sequencer = ${_sequencer_bft_template}
    syncOperatorBftSequencer2.sequencer.config {
      storage.config.properties.databaseName = "sequencer_driver_sync_operator_bft_2"
      consensus-empty-block-creation-timeout = 250ms
      initial-network.server-endpoint.port = 29210
      initial-network.server-endpoint.external-port = 29210
      initial-network.peer-endpoints = [
        ${_sync_operator_bft_peer} { port = 29110 }
        ${_sync_operator_bft_peer} { port = 29310 }
        ${_sync_operator_bft_peer} { port = 29410 }
      ]
    }

    syncOperatorBftSequencer3 = ${_sequencer_reference_template} ${_sync_operator_bft_auto_init} {
      public-api.port = 29308
      admin-api.port = 29309
      storage.config.properties.databaseName = "sequencer_sync_operator_bft_3"
    }
    syncOperatorBftSequencer3.sequencer = ${_sequencer_bft_template}
    syncOperatorBftSequencer3.sequencer.config {
      storage.config.properties.databaseName = "sequencer_driver_sync_operator_bft_3"
      consensus-empty-block-creation-timeout = 250ms
      initial-network.server-endpoint.port = 29310
      initial-network.server-endpoint.external-port = 29310
      initial-network.peer-endpoints = [
        ${_sync_operator_bft_peer} { port = 29110 }
        ${_sync_operator_bft_peer} { port = 29210 }
        ${_sync_operator_bft_peer} { port = 29410 }
      ]
    }

    syncOperatorBftSequencer4 = ${_sequencer_reference_template} ${_sync_operator_bft_auto_init} {
      public-api.port = 29408
      admin-api.port = 29409
      storage.config.properties.databaseName = "sequencer_sync_operator_bft_4"
    }
    syncOperatorBftSequencer4.sequencer = ${_sequencer_bft_template}
    syncOperatorBftSequencer4.sequencer.config {
      storage.config.properties.databaseName = "sequencer_driver_sync_operator_bft_4"
      consensus-empty-block-creation-timeout = 250ms
      initial-network.server-endpoint.port = 29410
      initial-network.server-endpoint.external-port = 29410
      initial-network.peer-endpoints = [
        ${_sync_operator_bft_peer} { port = 29110 }
        ${_sync_operator_bft_peer} { port = 29210 }
        ${_sync_operator_bft_peer} { port = 29310 }
      ]
    }
  }

  mediators {
    syncOperatorBftMediator1 = ${_mediator_template} ${_sync_operator_bft_auto_init} {
      admin-api.port = 29107
      storage.config.properties.databaseName = "mediator_sync_operator_bft_1"
    }

    syncOperatorBftMediator2 = ${_mediator_template} ${_sync_operator_bft_auto_init} {
      admin-api.port = 29207
      storage.config.properties.databaseName = "mediator_sync_operator_bft_2"
    }

    syncOperatorBftMediator3 = ${_mediator_template} ${_sync_operator_bft_auto_init} {
      admin-api.port = 29307
      storage.config.properties.databaseName = "mediator_sync_operator_bft_3"
    }

    syncOperatorBftMediator4 = ${_mediator_template} ${_sync_operator_bft_auto_init} {
      admin-api.port = 29407
      storage.config.properties.databaseName = "mediator_sync_operator_bft_4"
    }
  }
}
