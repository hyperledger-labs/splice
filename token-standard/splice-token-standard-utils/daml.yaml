sdk-version: 3.5.7
name: splice-token-standard-utils
version: 2.0.0
source: daml
dependencies:
- daml-prim
- daml-stdlib
data-dependencies:
- ../splice-api-token-metadata-v1/.daml/dist/splice-api-token-metadata-v1-current.dar
- ../splice-api-token-transfer-events-v2/.daml/dist/splice-api-token-transfer-events-v2-current.dar
- ../splice-api-token-holding-v1/.daml/dist/splice-api-token-holding-v1-current.dar
- ../splice-api-token-holding-v2/.daml/dist/splice-api-token-holding-v2-current.dar
- ../splice-api-token-allocation-v1/.daml/dist/splice-api-token-allocation-v1-current.dar
- ../splice-api-token-allocation-v2/.daml/dist/splice-api-token-allocation-v2-current.dar
- ../splice-api-token-allocation-instruction-v1/.daml/dist/splice-api-token-allocation-instruction-v1-current.dar
- ../splice-api-token-allocation-instruction-v2/.daml/dist/splice-api-token-allocation-instruction-v2-current.dar
- ../splice-api-token-allocation-request-v1/.daml/dist/splice-api-token-allocation-request-v1-current.dar
- ../splice-api-token-allocation-request-v2/.daml/dist/splice-api-token-allocation-request-v2-current.dar
- ../splice-api-token-transfer-instruction-v1/.daml/dist/splice-api-token-transfer-instruction-v1-current.dar
- ../splice-api-token-transfer-instruction-v2/.daml/dist/splice-api-token-transfer-instruction-v2-current.dar

build-options:
  - --explicit-serializable=yes
  - --target=2.1

  - --force-utility-package=yes
  # Use ^^^ to disallow template and interface definitions and make all types
  # unserializable, which ensures that different versions of this pacakage are
  # always SCU-compatible.
codegen:
  java:
    package-prefix: org.lfdecentralizedtrust.splice.codegen.java
    decoderClass: org.lfdecentralizedtrust.splice.codegen.java.DecoderSpliceTokenStandardUtils
    output-directory: target/daml-codegen-java
