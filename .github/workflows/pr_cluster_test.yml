name: Trigger a cluster test on a PR
on:
  issue_comment:
    types: [created]
  workflow_call:
    inputs:
      workflow:
        type: string
        required: true
      pr_number:
        type: number
        required: true
      cluster:
        type: string
        required: false
        default: ''
      approver:
        type: string
        required: false
        default: ''
permissions:
  contents: read
  issues: read
  pull-requests: write # To comment back on the PR
  id-token: write

jobs:

  get_head:
    runs-on: ubuntu-24.04
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    outputs:
      sha: ${{ steps.get_head.outputs.sha }}
      repo: ${{ steps.get_head.outputs.repo }}
    steps:
      - name: Get head SHA
        id: get_head
        run: |
          set -euo pipefail
          pr_number="${{ github.event.issue.number }}${{ inputs.pr_number }}"
          echo "PR number: $pr_number"
          query='query pullRequestDetails { repository(name: \"${{ github.event.repository.name }}\", owner: \"${{ github.repository_owner }}\") { pullRequest(number: '"$pr_number"') { headRef { target { oid } } } } }'
          echo "query: $query"
          result=$(curl -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -X POST -d " { \"query\": \"$query\" } " https://api.github.com/graphql)
          if ! echo "$result" | jq empty > /dev/null 2>&1; then
            echo "GitHub API did not return valid JSON. Response: $result"
            exit 1
          fi
          sha=$(echo "$result" | jq -r '.data.repository.pullRequest.headRef.target.oid')
          if [ "$sha" == "null" ] || [ -z "$sha" ]; then
            echo "Failed to fetch SHA from API. Full response: $result"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  determine_test_type:
    runs-on: ubuntu-24.04
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    outputs:
      workflow: ${{ steps.determine_test_type.outputs.workflow }}
      cluster: ${{ steps.determine_test_type.outputs.cluster }}
      approver: ${{ steps.determine_test_type.outputs.approver }}
    steps:
      - name: Determine test type
        id: determine_test_type
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUTS_WORKFLOW: ${{ inputs.workflow }}
          INPUTS_CLUSTER: ${{ inputs.cluster }}
          INPUTS_APPROVER: ${{ inputs.approver }}
        with:
          script: |
            const allowedScratchnets = ['scratchneta', 'scratchnetb', 'scratchnetc', 'scratchnetd', 'scratchnete'];
            let workflow = '';
            let cluster = '';
            let approver = '';

            if (process.env.INPUTS_WORKFLOW !== '') {
              workflow = process.env.INPUTS_WORKFLOW;
              cluster = process.env.INPUTS_CLUSTER || '';
              approver = process.env.INPUTS_APPROVER || '';
            } else {
              const body = context.payload.comment.body || '';
              approver = context.payload.comment.user.login || '';

              const clusterTestMatch = body.match(/\/cluster_test(?:\s+(\S+))?/);
              if (clusterTestMatch) {
                workflow = 'cluster_test';
                const arg = (clusterTestMatch[1] || '').toLowerCase().replace(/^[`]+/, '').replace(/[.,;:!?)\]`]+$/, '');
                if (allowedScratchnets.includes(arg)) {
                  cluster = arg;
                } else {
                  cluster = '';
                }
              } else if (body.includes('/hdm_test')) {
                workflow = 'hdm_test';
              } else if (body.includes('/lsu_test')) {
                workflow = 'lsu_test';
              } else if (body.includes('/upgrade_test')) {
                workflow = 'upgrade_test';
              }
            }

            core.setOutput('workflow', workflow);
            core.setOutput('cluster', cluster);
            core.setOutput('approver', approver);

  trigger_test:
    needs:
      - get_head
      - determine_test_type
    if: needs.determine_test_type.outputs.workflow != '' && (needs.determine_test_type.outputs.workflow != 'cluster_test' || needs.determine_test_type.outputs.cluster != '')
    uses: ./.github/workflows/cluster_tests.yml
    secrets: inherit
    with:
      workflow: ${{ needs.determine_test_type.outputs.workflow }}
      sha: ${{ needs.get_head.outputs.sha }}
      cluster: ${{ needs.determine_test_type.outputs.cluster }}
      approver: ${{ needs.determine_test_type.outputs.approver }}

  cluster_test_usage:
    runs-on: ubuntu-24.04
    needs:
      - get_head
      - determine_test_type
    if: needs.determine_test_type.outputs.workflow == 'cluster_test' && needs.determine_test_type.outputs.cluster == ''
    steps:
      - name: Comment usage on the PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "No test was triggered. To trigger a cluster test (DA-internal only), first lock a scratchnet cluster and then comment `/cluster_test <scratchnet>` where `<scratchnet>` is the locked cluster, one of `scratchneta`, `scratchnetb`, `scratchnetc`, `scratchnetd`, `scratchnete` (e.g. `/cluster_test scratchneta`).\n\nTo lock, run `cncluster lock` in `cluster/deployment/<scratchnet>`."
            });

  result:
    runs-on: ubuntu-24.04
    needs:
      - get_head
      - determine_test_type
      - trigger_test
    if: needs.determine_test_type.outputs.workflow == 'cluster_test' && needs.determine_test_type.outputs.cluster != ''
    steps:
      - name: parse the result
        id: parse
        run: |
          result='${{ needs.trigger_test.outputs.result }}'
          url=$(echo "$result" | jq -r '.html_url // .run_url // empty')
          if [ -z "$url" ]; then
            run_id=$(echo "$result" | jq -r '.run_id // empty')
            url="https://github.com/DACH-NY/canton-network-internal/actions/runs/$run_id"
          fi
          echo "Deploy scratchnet pipeline triggered for [Commit ${{ needs.get_head.outputs.sha }} in ${{ needs.get_head.outputs.repo }}](https://github.com/${{ github.repository }}/pull/${{ github.event.issue.number }}/files/${{ needs.get_head.outputs.sha }}), track progress here: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment on the PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script : |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Deploy cluster test on ${{ needs.determine_test_type.outputs.cluster }} triggered for [Commit ${{ needs.get_head.outputs.sha }} in ${{ needs.get_head.outputs.repo }}](https://github.com/${{ github.repository }}/pull/${{ github.event.issue.number }}/files/${{ needs.get_head.outputs.sha }}). Track progress here: ${{ steps.parse.outputs.url }}"
            });

  result_hdm:
    runs-on: ubuntu-24.04
    needs:
      - get_head
      - determine_test_type
      - trigger_test
    if: needs.determine_test_type.outputs.workflow == 'hdm_test'
    steps:
      - name: parse the result
        id: parse
        run: |
          number=$(echo '${{ needs.trigger_test.outputs.result }}' | jq -r '.number')
          echo "Deploy scratchnet HDM pipeline triggered for [Commit ${{ needs.get_head.outputs.sha }} in ${{ needs.get_head.outputs.repo }}](https://github.com/${{ github.repository }}/pull/${{ github.event.issue.number }}/files/${{ needs.get_head.outputs.sha }}), please approve it in CircleCI: https://app.circleci.com/pipelines/github/DACH-NY/canton-network-internal/${number}"
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Comment on the PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script : |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Deploy HDM pipeline triggered for [Commit ${{ needs.get_head.outputs.sha }} in ${{ needs.get_head.outputs.repo }}](https://github.com/${{ github.repository }}/pull/${{ github.event.issue.number }}/files/${{ needs.get_head.outputs.sha }}), please contact a Contributor to approve it in CircleCI: https://app.circleci.com/pipelines/github/DACH-NY/canton-network-internal/${{ steps.parse.outputs.number }}"
            });

  result_lsu:
    runs-on: ubuntu-24.04
    needs:
      - get_head
      - determine_test_type
      - trigger_test
    if: needs.determine_test_type.outputs.workflow == 'lsu_test'
    steps:
      - name: parse the result
        id: parse
        run: |
          number=$(echo '${{ needs.trigger_test.outputs.result }}' | jq -r '.number')
          echo "Deploy scratchnet LSU pipeline triggered for [Commit ${{ needs.get_head.outputs.sha }} in ${{ needs.get_head.outputs.repo }}](https://github.com/${{ github.repository }}/pull/${{ github.event.issue.number }}/files/${{ needs.get_head.outputs.sha }}), please approve it in CircleCI: https://app.circleci.com/pipelines/github/DACH-NY/canton-network-internal/${number}"
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Comment on the PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script : |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Deploy LSU pipeline triggered for [Commit ${{ needs.get_head.outputs.sha }} in ${{ needs.get_head.outputs.repo }}](https://github.com/${{ github.repository }}/pull/${{ github.event.issue.number }}/files/${{ needs.get_head.outputs.sha }}), please contact a Contributor to approve it in CircleCI: https://app.circleci.com/pipelines/github/DACH-NY/canton-network-internal/${{ steps.parse.outputs.number }}"
            });

  result_upgrade:
    runs-on: ubuntu-24.04
    needs:
      - get_head
      - determine_test_type
      - trigger_test
    if: needs.determine_test_type.outputs.workflow == 'upgrade_test'
    steps:
      - name: parse the result
        id: parse
        run: |
          number=$(echo '${{ needs.trigger_test.outputs.result }}' | jq -r '.number')
          echo "Deploy scratchnet upgrade pipeline triggered for [Commit ${{ needs.get_head.outputs.sha }} in ${{ needs.get_head.outputs.repo }}](https://github.com/${{ github.repository }}/pull/${{ github.event.issue.number }}/files/${{ needs.get_head.outputs.sha }}), please approve it in CircleCI: https://app.circleci.com/pipelines/github/DACH-NY/canton-network-internal/${number}"
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Comment on the PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script : |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Deploy upgrade pipeline triggered for [Commit ${{ needs.get_head.outputs.sha }} in ${{ needs.get_head.outputs.repo }}](https://github.com/${{ github.repository }}/pull/${{ github.event.issue.number }}/files/${{ needs.get_head.outputs.sha }}), please contact a Contributor to approve it in CircleCI: https://app.circleci.com/pipelines/github/DACH-NY/canton-network-internal/${{ steps.parse.outputs.number }}"
            });
