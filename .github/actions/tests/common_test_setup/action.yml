name: Common Test Setup
description: Common setup for tests
inputs:
  test_name:
    description: "Name of the test suite"
    required: true
  with_sbt:
    description: "Whether to set up SBT"
    required: false
    default: "true"
  save_nix_cache:
    description: "Whether to save the Nix cache"
    required: false
    default: "false"
  save_nix_cache_to_gcp:
    description: "Whether to save the Nix cache to GCP"
    required: false
    default: "false"
  target:
    description: "Choose nix target: static_tests - for static tests, default - for full dependencies"
    default: 'default'
#    type: choice
#    options:
#      - oss
#      - default
#      - static_tests
    required: false
  upload_workload_identity_provider:
    description: "The workload identity provider to use for uploading the cache"
    required: false
    default: ""
  upload_service_account:
    description: "The service account to use for uploading the cache"
    required: false
    default: ""
  cache_version:
    description: "Cache version"
    required: true
  fetch_git_refs:
    description: |
      Which git refs to fetch beyond the checked-out commit (see common_setup.sh):
      none (default), shallow (main and latest release-line tips, depth 1) or
      history (main, PR head branch and latest release line, full commit history without blobs)
    required: false
    default: "none"

outputs:
  sbt_cache_hits:
    description: "Cache hits"
    value: ${{ steps.setup_sbt.outputs.cache_hits }}

runs:
  using: "composite"
  steps:

    - name: Publish test name metric
      uses: miguelteixeiraa/action-run-in-background@e28f036c202e9066287e6a50ce8b80749627cc7d # v1.0.0
      with:
        script: ./.github/actions/scripts/publish_gha_metrics.py --test_suite ${{ inputs.test_name }}

    - name: Setup
      shell: bash
      run: ./.github/actions/scripts/common_setup.sh
      env:
        FETCH_GIT_REFS: ${{ inputs.fetch_git_refs }}

    - name: Report git size
      shell: bash
      run: ./.github/actions/scripts/report_git_size.sh

    - name: Set up Nix (Self hosted)
      uses: ./.github/actions/nix/setup_nix
      with:
        cache_version: ${{ inputs.cache_version }}
        should_save: ${{ inputs.save_nix_cache }}
        should_save_gcp: ${{ inputs.save_nix_cache_to_gcp }}
        target: ${{ inputs.target }}
        upload_workload_identity_provider: ${{ inputs.upload_workload_identity_provider }}
        upload_service_account: ${{ inputs.upload_service_account }}

    - name: Set up SBT
      if: inputs.with_sbt == 'true'
      id: setup_sbt
      uses: ./.github/actions/sbt/setup_sbt
      with:
        cache_version: ${{ inputs.cache_version }}
