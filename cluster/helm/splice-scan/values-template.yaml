imageRepo: "ghcr.io/digital-asset/decentralized-canton-sync/docker"
imageName: "scan-app"
ui:
  imageName: "scan-web-ui"

# -- Annotations and labels for the participant pod
pod:
  annotations: {}
  labels: {}

defaultJvmOptions: -XX:+UseG1GC -XX:+UseStringDeduplication -XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=70 -Dscala.concurrent.context.numThreads=12 -XX:ActiveProcessorCount=12 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/persistent-data/heap-dump-CURRENT_DATE.hprof
resources:
  limits:
    memory: 6Gi
  requests:
    cpu: "3"
    memory: 3Gi

metrics:
  enable: false
  release: prometheus-grafana-monitoring
  interval: 30s

persistence:
  databaseName: cantonnet_scan
  schema: scan
  host: postgres
  port: 5432
  user: cnadmin
  secretName: "postgres-secrets"
  initImageName: "postgres:14"
#  secretOverrides:
#    postgresPassword: ""
  # The user version of the ACS store (optional), a positive integer,
  # set to 1 if previously unset to re-ingest, increment by 1 to subsequently re-ingest, the ACS store
  # acsStoreDescriptorUserVersion:

  # The user version of the TxLog store (optional), a positive integer,
  # set to 1 if previously unset to re-ingest, increment by 1 to subsequently re-ingest, the TxLog store
  # txLogStoreDescriptorUserVersion:


failOnAppVersionMismatch: true

spliceInstanceNames:
  networkName: # Please provide a value as provided in the docs
  networkFaviconUrl: # Please provide a value as provided in the docs
  amuletName: # Please provide a value as provided in the docs
  amuletNameAcronym: # Please provide a value as provided in the docs
  nameServiceName: # Please provide a value as provided in the docs
  nameServiceNameAcronym: # Please provide a value as provided in the docs

# k8s affinity for all deployed pods (optional)
# affinity:

# k8s nodeSelector for all deployed pods (optional)
# nodeSelector:

# k8s tolerations for all deployed pods (optional)
# tolerations:

# k8s priorityClassName for all deployed pods (optional)
# priorityClassName:

# set the poll interval used by the UI in milliseconds (optional)
# uiPollInterval:

service:
  ui:
    port: 80
logLevel: DEBUG

# bulk storage configuration
# bulkStorage:
#   staging:
#     bucketName: # please provide a value as provided in the docs
#     region: # please provide a value as provided in the docs
#     endpoint: # please provide a value as provided in the docs
#     secretName: splice-app-bulk-storage-staging-credentials
#   committed:
#     bucketName: # please provide a value as provided in the docs
#     region: # please provide a value as provided in the docs
#     endpoint: # please provide a value as provided in the docs
#     secretName: splice-app-bulk-storage-committed-credentials

# should stakater reloader annotation be added (note: reloader needs to be installed separately)
enableReloader: true

#auth:
#  secretOverrides:
#    ledgerApiUser: ""
#    audience: ""
#    token: ""
#    url: ""
#    clientId: ""
#    clientSecret: ""
#    scope: ""

securityContexts:
  pod:
    security_context_profile: pod_security_context
    fsGroup: 1001
    fsGroupChangePolicy: "OnRootMismatch"
  containers:
    scan:
      security_context_profile: app_security_context
    persistence:
      security_context_profile: persistent_security_context
    ui:
      security_context_profile: ui_security_context
      runAsNonRoot: true
      runAsUser: 101
      runAsGroup: 101

