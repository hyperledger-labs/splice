suite: "SV values"
templates:
  - sv.yaml
release:
  # Set for testing labels
  name: mock-sv
chart:
  # Override for testing labels
  version: 0.1.1
  appVersion: 0.1.0

# Things we need just to pass the schema
set:
  domain:
    sequencerPublicUrl: "https://sequencer.mock.com"
    sequencerAddress: "sequencer-address"
    mediatorAddress: "mediator-address"
    sequencerPruningConfig:
      enabled: false
  scan:
    publicUrl: "https://scan.mock.com"
    internalUrl: "https://scan-internal.mock.com"
  nodeIdentifier: "helm-mock-1-validator"
  onboardingName: "some-sv"
  participantAddress: "mock-address"
  spliceInstanceNames:
    networkName: MockNet
    networkFaviconUrl: https://mock.net/favicon.ico
    amuletName: Mocklet
    amuletNameAcronym: MCK
    nameServiceName: Mock Name Service
    nameServiceNameAcronym: MNS
  auth:
    jwksUrl: "https://mock.com/.well-known/jwks.json"
    audience: "mock_audience"

tests:
  - it: "sets join-with-key onboarding config incl. sponsor scan"
    set:
      joinWithKeyOnboarding:
        sponsorApiUrl: "https://sponsor.mock.com"
        sponsorScanUrl: "https://sponsor-scan.mock.com"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=='sv-app')].env[?(@.name=='ADDITIONAL_CONFIG_SV_ONBOARDING')].value
          value: |
            _onboarding {
              type = "join-with-key"
              sv-client.admin-api.url = "https://sponsor.mock.com"
              scan-client.admin-api.url = "https://sponsor-scan.mock.com"
            }

  - it: "fails join-with-key onboarding config without sponsor scan"
    set:
      joinWithKeyOnboarding:
        sponsorApiUrl: "https://sponsor.mock.com"
    asserts:
      - failedTemplate:
          errorPattern: "sponsorScanUrl"

  - it: "sets JWKS timeouts"
    set:
      auth:
        jwks:
          connectionTimeout: "33s"
          readTimeout: "44s"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=='sv-app')].env[?(@.name=='SPLICE_APP_VALIDATOR_AUTH_JWKS_CONNECTION_TIMEOUT')].value
          value: "33s"
      - equal:
          path: spec.template.spec.containers[?(@.name=='sv-app')].env[?(@.name=='SPLICE_APP_VALIDATOR_AUTH_JWKS_READ_TIMEOUT')].value
          value: "44s"

  - it: "sets extra-beneficiaries"
    set:
      extraBeneficiaries:
        - beneficiary: "beneficiary1"
          weight: 10
        - beneficiary: "beneficiary2"
          weight: 25
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=='sv-app')].env[?(@.name=='ADDITIONAL_CONFIG_BENEFICIARIES_0')].value
          value: |
            canton.sv-apps.sv.extra-beneficiaries.0 = {
              beneficiary = "beneficiary1"
              weight = 10
            }
      - equal:
          path: spec.template.spec.containers[?(@.name=='sv-app')].env[?(@.name=='ADDITIONAL_CONFIG_BENEFICIARIES_1')].value
          value: |
            canton.sv-apps.sv.extra-beneficiaries.1 = {
              beneficiary = "beneficiary2"
              weight = 25
            }

  - it: "accepts string values for extra-beneficiaries weight, to maintain backward compatibility till string values are disallowed"
    set:
      extraBeneficiaries:
        - beneficiary: "beneficiary1"
          weight: "10"
        - beneficiary: "beneficiary2"
          weight: "25"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=='sv-app')].env[?(@.name=='ADDITIONAL_CONFIG_BENEFICIARIES_0')].value
          value: |
            canton.sv-apps.sv.extra-beneficiaries.0 = {
              beneficiary = "beneficiary1"
              weight = 10
            }
      - equal:
          path: spec.template.spec.containers[?(@.name=='sv-app')].env[?(@.name=='ADDITIONAL_CONFIG_BENEFICIARIES_1')].value
          value: |
            canton.sv-apps.sv.extra-beneficiaries.1 = {
              beneficiary = "beneficiary2"
              weight = 25
            }

  - it: "sets topology snapshot configuration"
    set:
      periodicTopologySnapshotConfig:
        location:
          bucket:
            projectId: "testProjectId"
            bucketName: "testBucketName"
          prefix: "testPrefix"
        backupInterval: "24h"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=='sv-app')].env[?(@.name=='ADDITIONAL_CONFIG_SPLICE_APP_SV_PERIODIC_TOPOLOGY_SNAPSHOT_CONFIG')].value
          value: |
            canton.sv-apps.sv.topology-snapshot-config = {
              location {
                type = gcp
                bucket {
                  project-id = "testProjectId"
                  bucket-name = "testBucketName"
                  credentials {
                    type = service-account
                    json-credentials = ${SPLICE_APP_VALIDATOR_BACKUP_BUCKET_SERVICE_ACCOUNT_CREDENTIALS}
                  }
                }
                prefix = "testPrefix"
              }
              backup-interval = "24h"
            }
  - it: "sets synchronizer configuration (backwards compatible)"
    set:
      domain:
        sequencerPublicUrl: "https://sequencer.test.com"
        sequencerAddress: "sequencer-test-address"
        mediatorAddress: "mediator-test-address"
        enableBftSequencer: true
        sequencerPruningConfig:
          enabled: true
          pruningInterval: "1h"
          retentionPeriod: "7d"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=='sv-app')].env[?(@.name=='ADDITIONAL_CONFIG_SV_DOMAIN')].value
          value: |
            canton.sv-apps.sv.local-synchronizer-nodes.current {
              sequencer {
                is-canton-bft-sequencer = true
                admin-api {
                  address = "sequencer-test-address"
                  port = 5009
                }
                internal-api {
                  address = "sequencer-test-address"
                  port = 5008
                }
                external-public-api-url = "https://sequencer.test.com"
                pruning {
                  pruning-interval = "1h"
                  retention-period = "7d"
                }
              }
              mediator {
                admin-api {
                  address = "mediator-test-address"
                  port = 5007
                }
              }
            }
  - it: "supports roll-forward-lsu configuration"
    set:
      domain:
        sequencerPublicUrl: "https://sequencer.test.com"
        sequencerAddress: "sequencer-test-address"
        mediatorAddress: "mediator-test-address"
        sequencerPruningConfig:
          enabled: true
          pruningInterval: "1h"
          retentionPeriod: "7d"
      rollForwardLsu:
        newPhysicalSynchronizerSerial: 23
        newPhysicalSynchronizerProtocolVersion: 42
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=='sv-app')].env[?(@.name=='ADDITIONAL_CONFIG_SV_ONBOARDING')].value
          value: |
            _onboarding {
              type = "roll-forward-lsu"
              new-physical-synchronizer-serial = 23
              new-physical-synchronizer-protocol-version = "42"
            }
  - it: "supports roll-forward-lsu configuration with export times"
    set:
      domain:
        sequencerPublicUrl: "https://sequencer.test.com"
        sequencerAddress: "sequencer-test-address"
        mediatorAddress: "mediator-test-address"
        sequencerPruningConfig:
          enabled: true
          pruningInterval: "1h"
          retentionPeriod: "7d"
      rollForwardLsu:
        newPhysicalSynchronizerSerial: 23
        newPhysicalSynchronizerProtocolVersion: 42
        exportTimes:
          topologyExportTime: "2026-04-30T00:00:00Z"
          trafficExportTime: "2026-04-30T00:01:00Z"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=='sv-app')].env[?(@.name=='ADDITIONAL_CONFIG_SV_ONBOARDING')].value
          value: |
            _onboarding {
              type = "roll-forward-lsu"
              new-physical-synchronizer-serial = 23
              new-physical-synchronizer-protocol-version = "42"
              export-times = {
                topology-export-time = {
                  type = "timestamp"
                  time = "2026-04-30T00:00:00Z"
                }
                traffic-export-time = {
                  type = "timestamp"
                  time = "2026-04-30T00:01:00Z"
                }
              }
            }
  - it: "supports roll-forward-lsu configuration with export times"
    set:
      domain:
        sequencerPublicUrl: "https://sequencer.test.com"
        sequencerAddress: "sequencer-test-address"
        mediatorAddress: "mediator-test-address"
        sequencerPruningConfig:
          enabled: true
          pruningInterval: "1h"
          retentionPeriod: "7d"
      rollForwardLsu:
        newPhysicalSynchronizerSerial: 23
        newPhysicalSynchronizerProtocolVersion: 42
        exportTimes:
          topologyExportTime: "2026-04-30T00:00:00Z"
          trafficExportTime: "2026-04-30T00:01:00Z"
          upgradeTime: "2026-04-30T00:02:00Z"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=='sv-app')].env[?(@.name=='ADDITIONAL_CONFIG_SV_ONBOARDING')].value
          value: |
            _onboarding {
              type = "roll-forward-lsu"
              new-physical-synchronizer-serial = 23
              new-physical-synchronizer-protocol-version = "42"
              export-times = {
                topology-export-time = {
                  type = "timestamp"
                  time = "2026-04-30T00:00:00Z"
                }
                traffic-export-time = {
                  type = "timestamp"
                  time = "2026-04-30T00:01:00Z"
                }
                upgrade-time = {
                  type = "timestamp"
                  time = "2026-04-30T00:02:00Z"
                }
              }
            }

  - it: "allows overriding sv-app image and initImage"
    set:
      imageRepo: "secure-registry.example.com"
      imageName: "custom-sv-app"
      persistence.initImageName: "secure-registry.example.com/postgres:14-custom"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='sv-app')].image
          pattern: "^secure-registry\\.example\\.com/custom-sv-app:"
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: "secure-registry.example.com/postgres:14-custom"

  - it: "allows overriding all 8 SV secret env vars with raw strings"
    set:
      joinWithKeyOnboarding.sponsorApiUrl: "https://sponsor.mock.com"
      joinWithKeyOnboarding.sponsorScanUrl: "https://sponsor-scan.mock.com"
      cometBFT.externalGovernanceKey: true
      identitiesExport.prefix: "mock-prefix"
      identitiesExport.bucket.bucketName: "mock-bucket"
      identitiesExport.bucket.jsonCredentials: "mock-creds"
      identitiesExport.bucket.projectId: "mock-project"
      identitiesExport.bucket.secretName: "mock-secret"
      periodicTopologySnapshotConfig.backupInterval: "24h"
      periodicTopologySnapshotConfig.location.prefix: "mock-prefix"
      periodicTopologySnapshotConfig.location.bucket.projectId: "mock-project"
      periodicTopologySnapshotConfig.location.bucket.bucketName: "mock-bucket"
      periodicTopologySnapshotConfig.location.bucket.secretName: "mock-secret"
      secretOverrides.svPublicKey: "vault:kv/data/sv/pub"
      secretOverrides.svPrivateKey: "vault:kv/data/sv/priv"
      persistence.secretOverrides.postgresPassword: "vault:kv/data/sv/pg"
      cometBFT.secretOverrides.governancePublicKey: "vault:kv/data/sv/comet-pub"
      cometBFT.secretOverrides.governancePrivateKey: "vault:kv/data/sv/comet-priv"
      identitiesExport.bucket.secretOverrides.jsonCredentials: "vault:kv/data/sv/ids-export"
      periodicTopologySnapshotConfig.location.bucket.secretOverrides.jsonCredentials: "vault:kv/data/sv/topology"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='sv-app')].env[?(@.name=='SPLICE_APP_SV_PUBLIC_KEY')].value
          pattern: "vault:kv/data/sv/pub"
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='sv-app')].env[?(@.name=='SPLICE_APP_SV_PRIVATE_KEY')].value
          pattern: "vault:kv/data/sv/priv"
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='sv-app')].env[?(@.name=='SPLICE_APP_POSTGRES_PASSWORD')].value
          pattern: "vault:kv/data/sv/pg"
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=='mock-sv-init')].env[?(@.name=='PGPASSWORD')].value
          pattern: "vault:kv/data/sv/pg"
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='sv-app')].env[?(@.name=='SPLICE_APP_SV_COMETBFT_GOVERNANCE_PUBLIC_KEY')].value
          pattern: "vault:kv/data/sv/comet-pub"
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='sv-app')].env[?(@.name=='SPLICE_APP_SV_COMETBFT_GOVERNANCE_PRIVATE_KEY')].value
          pattern: "vault:kv/data/sv/comet-priv"
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='sv-app')].env[?(@.name=='SPLICE_APP_SV_IDS_BACKUP_BUCKET_SERVICE_ACCOUNT_CREDENTIALS')].value
          pattern: "vault:kv/data/sv/ids-export"
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='sv-app')].env[?(@.name=='SPLICE_APP_VALIDATOR_BACKUP_BUCKET_SERVICE_ACCOUNT_CREDENTIALS')].value
          pattern: "vault:kv/data/sv/topology"

  - it: "renders zero secretKeyRefs and correctly injects raw strings when all overrides are provided"
    set:
      auth:
        jwksUrl: "https://mock.com/.well-known/jwks.json"
        audience: "mock_audience"
        secretOverrides:
          ledgerApiUser: "vault:kv/data/sv/auth-user"
          audience: "vault:kv/data/sv/auth-aud"
          token: "vault:kv/data/sv/auth-token"
          url: "vault:kv/data/sv/auth-url"
          clientId: "vault:kv/data/sv/auth-client-id"
          clientSecret: "vault:kv/data/sv/auth-client-secret"
          scope: "vault:kv/data/sv/auth-scope"
      joinWithKeyOnboarding:
        sponsorApiUrl: "https://sponsor.mock.com"
        sponsorScanUrl: "https://sponsor-scan.mock.com"
      cometBFT:
        externalGovernanceKey: true
        secretOverrides:
          governancePublicKey: "vault:kv/data/sv/comet-pub"
          governancePrivateKey: "vault:kv/data/sv/comet-priv"
      identitiesExport:
        prefix: "mock-prefix"
        bucket:
          bucketName: "mock-bucket"
          jsonCredentials: "mock-creds"
          projectId: "mock-project"
          secretName: "mock-secret"
          secretOverrides:
            jsonCredentials: "vault:kv/data/sv/ids-export"
      periodicTopologySnapshotConfig:
        backupInterval: "24h"
        location:
          prefix: "mock-prefix"
          bucket:
            projectId: "mock-project"
            bucketName: "mock-bucket"
            secretName: "mock-secret"
            secretOverrides:
              jsonCredentials: "vault:kv/data/sv/topology"
      secretOverrides:
        svPublicKey: "vault:kv/data/sv/pub"
        svPrivateKey: "vault:kv/data/sv/priv"
      persistence:
        secretOverrides:
          postgresPassword: "vault:kv/data/sv/pg"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name=='sv-app')].env[?(@.valueFrom.secretKeyRef)]
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='sv-app')].env[?(@.name=='SPLICE_APP_SV_LEDGER_API_AUTH_USER_NAME')].value
          pattern: "vault:kv/data/sv/auth-user"
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='sv-app')].env[?(@.name=='SPLICE_APP_SV_LEDGER_API_AUTH_AUDIENCE')].value
          pattern: "vault:kv/data/sv/auth-aud"
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='sv-app')].env[?(@.name=='SPLICE_APP_SV_LEDGER_API_AUTH_URL')].value
          pattern: "vault:kv/data/sv/auth-url"
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='sv-app')].env[?(@.name=='SPLICE_APP_SV_LEDGER_API_AUTH_CLIENT_ID')].value
          pattern: "vault:kv/data/sv/auth-client-id"
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='sv-app')].env[?(@.name=='SPLICE_APP_SV_LEDGER_API_AUTH_CLIENT_SECRET')].value
          pattern: "vault:kv/data/sv/auth-client-secret"
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='sv-app')].env[?(@.name=='SPLICE_APP_SV_LEDGER_API_AUTH_SCOPE')].value
          pattern: "vault:kv/data/sv/auth-scope"
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='sv-app')].env[?(@.name=='SPLICE_APP_VALIDATOR_LEDGER_API_AUTH_USER_NAME')].value
          pattern: "vault:kv/data/sv/auth-user"

  - it: "injects custom serviceAccountName into Deployment when specified"
    set:
      serviceAccountName: "custom-sv-sa"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: "custom-sv-sa"
  - it: "persistentDataPvc creates volume and mount for heap dumps at /persistent-data"
    set:
      persistentDataPvc:
        size: "5Gi"
        volumeStorageClass: "standard"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: sv-app-volume
            mountPath: /persistent-data
      - contains:
          path: spec.template.spec.volumes
          content:
            name: sv-app-volume
            persistentVolumeClaim:
              claimName: mock-sv-sv-app-pvc

  - it: "persistentDataPvc creates a PersistentVolumeClaim resource"
    set:
      persistentDataPvc:
        size: "5Gi"
        volumeStorageClass: "standard"
    documentSelector:
      path: metadata.name
      value: mock-sv-sv-app-pvc
    asserts:
      - equal:
          path: kind
          value: PersistentVolumeClaim
      - equal:
          path: spec.resources.requests.storage
          value: "5Gi"
      - equal:
          path: spec.storageClassName
          value: "standard"
      - equal:
          path: metadata.annotations
          value:
            helm.sh/resource-policy: keep

  - it: "persistentDataPvc is not created by default"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: sv-app-volume
            persistentVolumeClaim:
              claimName: mock-sv-sv-app-pvc

  - it: "sets default security contexts for pod, sv-app, and init container"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[?(@.name=='sv-app')].securityContext
          value:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
      - equal:
          path: spec.template.spec.initContainers[?(@.name=='mock-sv-init')].securityContext
          value:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL

  - it: "allows overriding security contexts via values"
    set:
      securityContexts:
        pod:
          runAsNonRoot: true
          seccompProfile:
            type: Localhost
            localhostProfile: profiles/hardened.json
        containers:
          sv:
            runAsUser: 5000
            allowPrivilegeEscalation: true
          persistence:
            runAsUser: 6000
            privileged: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
            runAsNonRoot: true
            seccompProfile:
              type: Localhost
              localhostProfile: profiles/hardened.json
      - equal:
          path: spec.template.spec.containers[?(@.name=='sv-app')].securityContext
          value:
            runAsNonRoot: true
            runAsUser: 5000
            runAsGroup: 1001
            allowPrivilegeEscalation: true
            privileged: false
            capabilities:
              drop:
                - ALL
      - equal:
          path: spec.template.spec.initContainers[?(@.name=='mock-sv-init')].securityContext
          value:
            runAsNonRoot: true
            runAsUser: 6000
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            privileged: true
            capabilities:
              drop:
                - ALL
