suite: "Validator values"
templates:
  - validator.yaml
release:
  # Set for testing labels
  name: mock-validator
chart:
  # Override for testing labels
  version: 0.1.1
  appVersion: 0.1.0

set:
  # Things we need just to pass the schema
  nodeIdentifier: "helm-mock-1-validator"
  validatorPartyHint: "helm-mock-1"
  validatorWalletUser: "mock-wallet-user-id"
  spliceInstanceNames:
    networkName: MockNet
    networkFaviconUrl: https://mock.net/favicon.ico
    amuletName: Mocklet
    amuletNameAcronym: MCK
    nameServiceName: Mock Name Service
    nameServiceNameAcronym: MNS
  topup:
    enabled: false
  auth:
    jwksUrl: "https://mock.com/.well-known/jwks.json"
    audience: "mock_audience"

tests:
  - it: "sets labels and annotations as expected"
    set:
      pod:
        labels:
          mock: yes-please
        annotations:
          mock-annotation: still-an-annotation
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      # Sanity check
      - equal:
          path: spec.template.spec.containers[0].name
          value: validator-app
      # Labels on deployment
      - isSubset:
          path: metadata.labels
          content:
            # Splice-specific
            app: validator-app
            # k8s/Helm standard
            app.kubernetes.io/instance: mock-validator
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/name: validator-app
            app.kubernetes.io/version: "0.1.0"
            helm.sh/chart: splice-validator-0.1.1
            # Extra for test
            mock: yes-please
      # Labels on pod; should be the same as on deployment
      - isSubset:
          path: spec.template.metadata.labels
          content:
            # Splice-specific
            app: validator-app
            # k8s/Helm standard
            app.kubernetes.io/instance: mock-validator
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/name: validator-app
            app.kubernetes.io/version: "0.1.0"
            helm.sh/chart: splice-validator-0.1.1
            # Extra for test
            mock: yes-please
      # Annotations on pod
      - equal:
          path: spec.template.metadata.annotations
          value:
            mock-annotation: still-an-annotation

  - it: "renders Stakater Reloader annotation by default"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: metadata.annotations["reloader.stakater.com/auto"]
          value: "true"

  - it: "omits Stakater Reloader annotation when enableReloader is false"
    set:
      enableReloader: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notExists:
          path: metadata.annotations

  - it: "always populates enable-wallet"
    set:
      enableWallet: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='ADDITIONAL_CONFIG_ENABLE_WALLET')].value
          value: |
            canton.validator-apps.validator_backend.enable-wallet = "false"

  - it: "sets JWKS timeouts"
    set:
      auth:
        jwks:
          connectionTimeout: "33s"
          readTimeout: "44s"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='SPLICE_APP_VALIDATOR_AUTH_JWKS_CONNECTION_TIMEOUT')].value
          value: "33s"
      - equal:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='SPLICE_APP_VALIDATOR_AUTH_JWKS_READ_TIMEOUT')].value
          value: "44s"

  - it: "supports disabling auth"
    set:
      disableAuth: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='SPLICE_APP_VALIDATOR_LEDGER_API_AUTH_USER_NAME')].value
          value: ledger-api-user
      - exists:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='ADDITIONAL_CONFIG_DISABLE_AUTH')].value

  - it: "configures scan-client for trust-single mode"
    set:
      scanClient:
        scanType: "trust-single"
        scanAddress: "https://single.scan.url:5004"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='ADDITIONAL_CONFIG_BFT_SCAN')].value
          pattern: "canton.validator-apps.validator_backend.scan-client.type = \"trust-single\""
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='ADDITIONAL_CONFIG_BFT_SCAN')].value
          pattern: 'canton.validator-apps.validator_backend.scan-client.url = "https://single.scan.url:5004"'

  - it: "configures scan-client for standard bft mode, including multiple seedUrls"
    set:
      scanClient:
        scanType: "bft"
        seedUrls: [ "https://bft-node-1.url:5003", "https://bft-node-2.url:5003" ]
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='ADDITIONAL_CONFIG_BFT_SCAN')].value
          pattern: "canton.validator-apps.validator_backend.scan-client.type = \"bft\""
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='ADDITIONAL_CONFIG_BFT_SCAN')].value
          pattern: 'canton.validator-apps.validator_backend.scan-client.seed-urls = \["https://bft-node-1.url:5003","https://bft-node-2.url:5003"\]'

  - it: "configures scan-client for bft-custom mode, including svNames and threshold"
    set:
      scanClient:
        scanType: "bft-custom"
        seedUrls: [ "https://custom-node-A.com", "https://custom-node-B.com" ]
        svNames: [ "custom-sv-1", "custom-sv-2", "custom-sv-3" ]
        threshold: 2
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='ADDITIONAL_CONFIG_BFT_SCAN')].value
          pattern: "canton.validator-apps.validator_backend.scan-client.type = \"bft-custom\""
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='ADDITIONAL_CONFIG_BFT_SCAN')].value
          pattern: 'canton.validator-apps.validator_backend.scan-client.seed-urls = \["https://custom-node-A.com","https://custom-node-B.com"\]'
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='ADDITIONAL_CONFIG_BFT_SCAN')].value
          pattern: 'canton.validator-apps.validator_backend.scan-client.sv-names = \["custom-sv-1","custom-sv-2","custom-sv-3"\]'
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='ADDITIONAL_CONFIG_BFT_SCAN')].value
          pattern: "canton.validator-apps.validator_backend.scan-client.threshold = 2"

  - it: "configures scan-client for trust-single when nonSvValidatorTrustSingleScan is true"
    set:
      nonSvValidatorTrustSingleScan: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='ADDITIONAL_CONFIG_NON_VALIDATOR_TRUST_SINGLE_SCAN')].value
          pattern: "canton.validator-apps.validator_backend.scan-client.type = \"trust-single\""

  - it: "defaults to BFT scan client with internal scan address if no config is set"
    set:
      svValidator: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='ADDITIONAL_CONFIG_BFT_SCAN')].value
          pattern: "canton.validator-apps.validator_backend.scan-client.type = \"bft\""
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='ADDITIONAL_CONFIG_BFT_SCAN')].value
          pattern: "canton\\.validator-apps\\.validator_backend\\.scan-client\\.seed-urls = \\[\\s*\\$\\{_scan\\.admin-api\\.address\\}\\s*\\]"

  - it: "defaults to BFT scan client when scanType is not specified"
    set:
      scanClient:
        seedUrls: [ "https://custom-node-A.com", "https://custom-node-B.com" ]
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='ADDITIONAL_CONFIG_BFT_SCAN')].value
          pattern: "canton.validator-apps.validator_backend.scan-client.type = \"bft\""
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='ADDITIONAL_CONFIG_BFT_SCAN')].value
          pattern: 'canton.validator-apps.validator_backend.scan-client.seed-urls = \["https://custom-node-A.com","https://custom-node-B.com"\]'
  - it: "uses decentralizedSynchronizerUrl when useSequencerConnectionsFromScan is false"
    set:
      useSequencerConnectionsFromScan: false
      decentralizedSynchronizerUrl: "https://legacy-sequencer.mock.com"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='ADDITIONAL_CONFIG_STATIC_SEQUENCER_URL')].value
          pattern: 'canton\.validator-apps\.validator_backend\.domains\.global\.url = "https://legacy-sequencer\.mock\.com"'

  - it: "uses synchronizer.url when provided"
    set:
      synchronizer:
        connectionType: "trust-single"
        url: "https://new-sequencer.mock.com"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='ADDITIONAL_CONFIG_SYNCHRONIZER_URL')].value
          pattern: 'canton\.validator-apps\.validator_backend\.domains\.global\.url = "https://new-sequencer\.mock\.com"'

  - it: "uses synchronizer.svNames as a JSON array when provided"
    set:
      synchronizer:
        connectionType: "bft-custom"
        svNames: [ "sequencer-1", "sequencer-2" ]
        threshold: 2
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='ADDITIONAL_CONFIG_SYNCHRONIZER_TRUSTED')].value
          pattern: 'canton\.validator-apps\.validator_backend\.domains\.global\.trusted-synchronizer-config\.sv-names = \["sequencer-1","sequencer-2"\]'
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='ADDITIONAL_CONFIG_SYNCHRONIZER_TRUSTED')].value
          pattern: 'canton\.validator-apps\.validator_backend\.domains\.global\.trusted-synchronizer-config\.threshold = 2'

  - it: "configures migrate-validator-party-scan-admin-api URL based on scanClient"
    set:
      migrateValidatorParty: true
      scanClient:
        scanType: "trust-single"
        scanAddress: "https://trusted-migration-scan.url"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='ADDITIONAL_CONFIG_MIGRATE_VALIDATOR_PARTY')].value
          pattern: 'canton\.validator-apps\.validator_backend\.migrate-validator-party\.scan\.admin-api\.url = "https://trusted-migration-scan\.url"'

  - it: "picks the first seedUrl for migrate-validator-party-scan-admin-api in BFT mode"
    set:
      migrateValidatorParty: true
      scanClient:
        scanType: "bft"
        seedUrls:
          - "https://first-seed.url"
          - "https://second-seed.url"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='ADDITIONAL_CONFIG_MIGRATE_VALIDATOR_PARTY')].value
          pattern: 'canton\.validator-apps\.validator_backend\.migrate-validator-party\.scan\.admin-api\.url = "https://first-seed\.url"'

  - it: "falls back to legacy internal address for migrate-validator-party-scan-admin-api when scanClient is missing"
    set:
      migrateValidatorParty: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='ADDITIONAL_CONFIG_MIGRATE_VALIDATOR_PARTY')].value
          pattern: 'canton\.validator-apps\.validator_backend\.migrate-validator-party\.scan\.admin-api\.url = \$\{_scan\.admin-api\.address\}'

  - it: "allows overriding imageName and persistence.initImage"
    set:
      imageName: "validator-2"
      persistence.initImageName: "secure-registry.com/postgres:14"
      persistence.enablePgInitContainer: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='validator-app')].image
          pattern: "validator-2:0\\.1\\.0$"
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=='mock-validator-init')].image
          pattern: "secure-registry.com/postgres:14"

  - it: "allows overriding nested persistence and bucket secret env vars with raw strings"
    set:
      persistence.secretOverrides.postgresPassword: "vault:kv/data/validator/postgres-password"
      persistence.enablePgInitContainer: true
      participantIdentitiesDumpPeriodicBackup.location.bucket.secretOverrides.jsonCredentials: "vault:kv/data/validator/bucket-creds"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='SPLICE_APP_POSTGRES_PASSWORD')].value
          pattern: "vault:kv/data/validator/postgres-password"
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name=='mock-validator-init')].env[?(@.name=='PGPASSWORD')].value
          pattern: "vault:kv/data/validator/postgres-password"
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='SPLICE_APP_VALIDATOR_BACKUP_BUCKET_SERVICE_ACCOUNT_CREDENTIALS')].value
          pattern: "vault:kv/data/validator/bucket-creds"

  - it: "renders zero secretKeyRefs and correctly injects raw strings when all overrides are provided"
    set:
      persistence.secretOverrides.postgresPassword: "vault:kv/data/validator/postgres-password"
      persistence.enablePgInitContainer: true
      participantIdentitiesDumpPeriodicBackup.location.bucket.secretOverrides.jsonCredentials: "vault:kv/data/validator/bucket-creds"
      auth.jwksUrl: "https://mock.com/.well-known/jwks.json"
      auth.audience: "mock_audience"
      auth.secretOverrides.ledgerApiUser: "vault:kv/data/validator/auth-user"
      auth.secretOverrides.audience: "vault:kv/data/validator/auth-aud"
      auth.secretOverrides.token: "vault:kv/data/validator/auth-token"
      auth.secretOverrides.url: "vault:kv/data/validator/auth-url"
      auth.secretOverrides.clientId: "vault:kv/data/validator/auth-client-id"
      auth.secretOverrides.clientSecret: "vault:kv/data/validator/auth-client-secret"
      auth.secretOverrides.scope: "vault:kv/data/validator/auth-scope"
      svValidator: true
      scanClient.scanType: "trust-single"
      scanClient.scanAddress: "http://scan"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.valueFrom.secretKeyRef)]
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='SPLICE_APP_SV_LEDGER_API_AUTH_USER_NAME')].value
          pattern: "vault:kv/data/validator/auth-user"
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='SPLICE_APP_VALIDATOR_LEDGER_API_AUTH_USER_NAME')].value
          pattern: "vault:kv/data/validator/auth-user"
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='SPLICE_APP_VALIDATOR_LEDGER_API_AUTH_AUDIENCE')].value
          pattern: "vault:kv/data/validator/auth-aud"
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='SPLICE_APP_VALIDATOR_LEDGER_API_AUTH_URL')].value
          pattern: "vault:kv/data/validator/auth-url"
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='SPLICE_APP_VALIDATOR_LEDGER_API_AUTH_CLIENT_ID')].value
          pattern: "vault:kv/data/validator/auth-client-id"
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='SPLICE_APP_VALIDATOR_LEDGER_API_AUTH_CLIENT_SECRET')].value
          pattern: "vault:kv/data/validator/auth-client-secret"
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='SPLICE_APP_VALIDATOR_LEDGER_API_AUTH_SCOPE')].value
          pattern: "vault:kv/data/validator/auth-scope"

  - it: "injects custom serviceAccountName into Deployment when specified"
    set:
      serviceAccountName: "custom-validator-sa"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: "custom-validator-sa"

  - it: "persistentDataPvc creates volume and mount for heap dumps at /persistent-data"
    set:
      persistentDataPvc:
        size: "5Gi"
        volumeStorageClass: "standard"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: validator-app-volume
            mountPath: /persistent-data
      - contains:
          path: spec.template.spec.volumes
          content:
            name: validator-app-volume
            persistentVolumeClaim:
              claimName: mock-validator-validator-app-pvc

  - it: "persistentDataPvc creates a PersistentVolumeClaim resource"
    set:
      persistentDataPvc:
        size: "5Gi"
        volumeStorageClass: "standard"
    documentSelector:
      path: metadata.name
      value: mock-validator-validator-app-pvc
    asserts:
      - equal:
          path: kind
          value: PersistentVolumeClaim
      - equal:
          path: spec.resources.requests.storage
          value: "5Gi"
      - equal:
          path: spec.storageClassName
          value: "standard"
      - equal:
          path: metadata.annotations
          value:
            helm.sh/resource-policy: keep

  - it: "persistentDataPvc is not created by default"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: validator-app-volume
            persistentVolumeClaim:
              claimName: mock-validator-validator-app-pvc

  - it: "sets default security contexts"
    set:
      persistence:
        enablePgInitContainer: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[?(@.name=='validator-app')].securityContext
          value:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
      - equal:
          path: spec.template.spec.initContainers[?(@.name=='mock-validator-init')].securityContext
          value:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL

# TODO(DACH-NY/canton-network-internal#5946) Avoid test repetition by refactoring test code

  - it: "allows overriding security contexts via values"
    set:
      persistence:
        enablePgInitContainer: true
      securityContexts:
        pod:
          runAsNonRoot: true
          seccompProfile:
            type: Localhost
            localhostProfile: profiles/harden.json
        containers:
          validator:
            runAsUser: 5000
            allowPrivilegeEscalation: true
          persistence:
            runAsUser: 6000
            privileged: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
            runAsNonRoot: true
            seccompProfile:
              type: Localhost
              localhostProfile: profiles/harden.json
      - equal:
          path: spec.template.spec.containers[?(@.name=='validator-app')].securityContext
          value:
            runAsNonRoot: true
            runAsUser: 5000
            runAsGroup: 1001
            allowPrivilegeEscalation: true
            privileged: false
            capabilities:
              drop:
                - ALL
      - equal:
          path: spec.template.spec.initContainers[?(@.name=='mock-validator-init')].securityContext
          value:
            runAsNonRoot: true
            runAsUser: 6000
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            privileged: true
            capabilities:
              drop:
                - ALL

  - it: "sets priorityClassName when provided"
    set:
      priorityClassName: high-priority
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: high-priority

  - it: "renders a numeric-looking priorityClassName as a string"
    set:
      priorityClassName: "42"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: "42"

  - it: "omits priorityClassName when not provided"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notExists:
          path: spec.template.spec.priorityClassName

  - it: "fails when an unknown key is set under synchronizer"
    set:
      synchronizer:
        connectionType: "trust-single"
        url: "https://new-sequencer.mock.com"
        notAValidKey: "boom"
    asserts:
      - failedTemplate:
          errorPattern: "at '/synchronizer': additional properties 'notAValidKey' not allowed"

  - it: "fails when an unknown key is set under scanClient"
    set:
      scanClient:
        scanType: "trust-single"
        scanAddress: "https://single.scan.url:5004"
        notAValidKey: "boom"
    asserts:
      - failedTemplate:
          errorPattern: "at '/scanClient': additional properties 'notAValidKey' not allowed"
  - it: "overrides Deployment name and labels when appLabels.validatorApp is set"
    set:
      appLabels.validatorApp: "custom-validator"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: metadata.name
          value: custom-validator
      - equal:
          path: metadata.labels.app
          value: custom-validator

  - it: "uses custom auth secret name when auth.secretName is set"
    set:
      auth.secretName: "my-custom-ledger-auth"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=='validator-app')].env[?(@.name=='SPLICE_APP_VALIDATOR_LEDGER_API_AUTH_USER_NAME')].valueFrom.secretKeyRef.name
