imageRepo: "ghcr.io/digital-asset/decentralized-canton-sync/docker"
imageName: "validator-app"
wallet:
  imageName: "wallet-web-ui"

fixedTokens: false

# Custom annotations and labels for deployed resources
pod:
  annotations: {}
  labels: {}

defaultJvmOptions: -XX:+UseG1GC -XX:+UseStringDeduplication -XX:MaxRAMPercentage=75 -XX:InitialRAMPercentage=75 -Dscala.concurrent.context.numThreads=8 -XX:ActiveProcessorCount=8 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/persistent-data/heap-dump-CURRENT_DATE.hprof -Dpekko.http.server.idle-timeout=20m -Dpekko.http.client.idle-timeout=20m
resources:
  limits:
    memory: 8Gi
  requests:
    cpu: 1
    memory: 4Gi

metrics:
  enable: false
  release: prometheus-grafana-monitoring
  interval: 30s

persistence:
  databaseName: cantonnet_validator
  schema: validator
  host: postgres
  port: 5432
  user: cnadmin
  secretName: "postgres-secrets"
  # Postgres role the charts connect as, including the pg-init containers (default cnadmin)
  # user: cnadmin
  # Database the pg-init container connects to in order to CREATE the target database (default cantonnet)
  # bootstrapDatabaseName: cantonnet
  enablePgInitContainer: true
  initImageName: "postgres:14"
  # Optional: Provide raw strings to override the default Kubernetes secret injection.
#  secretOverrides:
#    postgresPassword: ""

migration:
  attachPvc: true
# pvc used for migrations
pvc:
  volumeName: domain-migration-validator-pvc
  volumeStorageClass: standard-rwo

useSequencerConnectionsFromScan: true

failOnAppVersionMismatch: true

# This will disable the wallet HTTP server and wallet automations when set to false
enableWallet: true

# k8s affinity for all deployed pods (optional)
# affinity:

# k8s nodeSelector for all deployed pods (optional)
# nodeSelector:

# k8s tolerations for all deployed pods (optional)
# tolerations:

# k8s priorityClassName for all deployed pods (optional)
# priorityClassName:

spliceInstanceNames:
  networkName: # Please provide a value as provided in the docs
  networkFaviconUrl: # Please provide a value as provided in the docs
  amuletName: # Please provide a value as provided in the docs
  amuletNameAcronym: # Please provide a value as provided in the docs
  nameServiceName: # Please provide a value as provided in the docs
  nameServiceNameAcronym: # Please provide a value as provided in the docs

service:
  ans:
    port: 80
  wallet:
    port: 80
# set the poll interval used by the UI in milliseconds (optional)
# uiPollInterval:

extraInitContainers: []

# set if ans-web-ui should be deployed
ansWebUi:
  enabled: true
  imageName: "ans-web-ui"
  # Optional: override the K8s secret name this component reads OIDC credentials from.
  # Default: "splice-app-cns-ui-auth".
  secretName: ""
  # Optional: Provide raw strings to override the default Kubernetes secret injection.
  # This is useful for integrating with external secret management tools.
  # Note: Ensure you have the appropriate mutating webhook/injector installed in your cluster.
#  secretOverrides:
#    clientId: ""
#    url: ""
# set if validator-web-ui should be deployed
validatorWebUi:
  enabled: true
  # Optional: override the K8s secret name this component reads OIDC credentials from.
  # Default: "splice-app-wallet-ui-auth".
  secretName: ""
  # Optional: Provide raw strings to override the default Kubernetes secret injection.
  # This is useful for integrating with external secret management tools.
  # Note: Ensure you have the appropriate mutating webhook/injector installed in your cluster.
#  secretOverrides:
#    clientId: ""
#    url: ""

# set to true to disable auth (this is highly insecure)
disableAuth: false

#auth:
#  # Optional: override the K8s secret name the validator app reads ledger API credentials from.
#  # Default: "splice-app-validator-ledger-api-auth".
#  secretName: ""
#  secretOverrides:
#    ledgerApiUser: ""
#    audience: ""
#    token: ""
#    url: ""
#    clientId: ""
#    clientSecret: ""
#    scope: ""

# Optional: override Deployment and Service names.
appLabels:
  validatorApp: ""   # default: "validator-app"
  walletWebUi: ""    # default: "wallet-web-ui"
  ansWebUi: ""       # default: "ans-web-ui"

logLevel: DEBUG

# should stakater reloader annotation be added (note: reloader needs to be installed separately)
enableReloader: true

securityContexts:
  pod:
    security_context_profile: pod_security_context
    fsGroup: 1001
    fsGroupChangePolicy: "OnRootMismatch"
  containers:
    validator:
      security_context_profile: app_security_context
    ansWebUi:
      security_context_profile: ui_security_context
    walletWebUi:
      security_context_profile: ui_security_context
    persistence:
      security_context_profile: persistent_security_context

# TODO(DACH-NY/canton-network-internal#5946) add static guards so that new charts don't forget to add security contexts.
